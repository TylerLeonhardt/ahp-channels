name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:package

  e2e-fakechat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: npm ci
      - run: npm run e2e:fakechat
        env:
          AHP_CHANNELS_E2E_USE_FIXTURE_HOST: "1"
      - run: npm run e2e:permissions
        env:
          AHP_CHANNELS_E2E_USE_FIXTURE_HOST: "1"
      - run: npm run e2e:attachments
        env:
          AHP_CHANNELS_E2E_USE_FIXTURE_HOST: "1"
